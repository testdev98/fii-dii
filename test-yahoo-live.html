<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahoo Finance Live Price Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
        .result {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }
        .price-display {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            color: #4CAF50;
        }
        .change {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .positive { color: #4CAF50; }
        .negative { color: #f44336; }
        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .info-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
        }
        .info-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔴 Yahoo Finance Live Price Test</h1>
        
        <div class="test-section">
            <h2>Test NIFTY 50 Live Price</h2>
            <button onclick="testNiftyPrice()">🔄 Fetch NIFTY Price (1-min interval)</button>
            <button onclick="testNiftyDaily()">📊 Fetch NIFTY Price (Daily)</button>
            <button onclick="testBankNifty()">🏦 Fetch BANKNIFTY Price</button>
            
            <div id="priceDisplay"></div>
            <div id="result" class="result"></div>
        </div>
    </div>

    <script>
        async function testNiftyPrice() {
            const resultDiv = document.getElementById('result');
            const priceDiv = document.getElementById('priceDisplay');
            resultDiv.textContent = '⏳ Fetching NIFTY data with 1-minute interval...';
            priceDiv.innerHTML = '';
            
            try {
                const url = 'https://query1.finance.yahoo.com/v8/finance/chart/^NSEI?interval=1m&range=1d';
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.chart?.result?.[0]) {
                    const result = data.chart.result[0];
                    const meta = result.meta;
                    const quote = result.indicators.quote[0];
                    const timestamps = result.timestamp || [];
                    const closePrices = quote.close || [];
                    
                    // Get last non-null price
                    let lastPrice = meta.regularMarketPrice;
                    let lastTimestamp = null;
                    for (let i = closePrices.length - 1; i >= 0; i--) {
                        if (closePrices[i] !== null && closePrices[i] !== undefined) {
                            lastPrice = closePrices[i];
                            lastTimestamp = timestamps[i];
                            break;
                        }
                    }
                    
                    const change = lastPrice - meta.previousClose;
                    const changePercent = (change / meta.previousClose) * 100;
                    
                    // Display price prominently
                    priceDiv.innerHTML = `
                        <div class="price-display">₹${lastPrice.toFixed(2)}</div>
                        <div class="change ${change >= 0 ? 'positive' : 'negative'}">
                            ${change >= 0 ? '▲' : '▼'} ${Math.abs(change).toFixed(2)} (${changePercent.toFixed(2)}%)
                        </div>
                        <div class="info">
                            <div class="info-card">
                                <div class="info-label">Previous Close</div>
                                <div class="info-value">₹${meta.previousClose.toFixed(2)}</div>
                            </div>
                            <div class="info-card">
                                <div class="info-label">Market State</div>
                                <div class="info-value">${meta.marketState}</div>
                            </div>
                            <div class="info-card">
                                <div class="info-label">Data Points</div>
                                <div class="info-value">${closePrices.filter(p => p !== null).length}</div>
                            </div>
                            <div class="info-card">
                                <div class="info-label">Last Update</div>
                                <div class="info-value">${lastTimestamp ? new Date(lastTimestamp * 1000).toLocaleTimeString() : 'N/A'}</div>
                            </div>
                        </div>
                    `;
                    
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                } else {
                    resultDiv.textContent = '❌ No data received\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.textContent = '❌ Error: ' + error.message;
                console.error('Error:', error);
            }
        }

        async function testNiftyDaily() {
            const resultDiv = document.getElementById('result');
            const priceDiv = document.getElementById('priceDisplay');
            resultDiv.textContent = '⏳ Fetching NIFTY data with daily interval...';
            priceDiv.innerHTML = '';

                const url = 'https://query1.finance.yahoo.com/v8/finance/chart/^NSEI?interval=1d&range=1d';
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.chart?.result?.[0]) {
                    const result = data.chart.result[0];
                    const meta = result.meta;
                    
                    const change = meta.regularMarketPrice - meta.previousClose;
                    const changePercent = (change / meta.previousClose) * 100;
                    
                    priceDiv.innerHTML = `
                        <div class="price-display">₹${meta.regularMarketPrice.toFixed(2)}</div>
                        <div class="change ${change >= 0 ? 'positive' : 'negative'}">
                            ${change >= 0 ? '▲' : '▼'} ${Math.abs(change).toFixed(2)} (${changePercent.toFixed(2)}%)
                        </div>
                        <div class="info">
                            <div class="info-card">
                                <div class="info-label">Previous Close</div>
                                <div class="info-value">₹${meta.previousClose.toFixed(2)}</div>
                            </div>
                            <div class="info-card">
                                <div class="info-label">Market State</div>
                                <div class="info-value">${meta.marketState}</div>
                            </div>
                        </div>
                    `;
                    
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                } else {
                    resultDiv.textContent = '❌ No data received\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.textContent = '❌ Error: ' + error.message;
                console.error('Error:', error);
            }
        }

        async function testBankNifty() {
            const resultDiv = document.getElementById('result');
            const priceDiv = document.getElementById('priceDisplay');
            resultDiv.textContent = '⏳ Fetching BANKNIFTY data...';
            priceDiv.innerHTML = '';
            
            try {
                const url = 'https://query1.finance.yahoo.com/v8/finance/chart/^NSEBANK?interval=1m&range=1d';
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.chart?.result?.[0]) {
                    const result = data.chart.result[0];
                    const meta = result.meta;
                    const quote = result.indicators.quote[0];
                    const closePrices = quote.close || [];
                    
                    let lastPrice = meta.regularMarketPrice;
                    for (let i = closePrices.length - 1; i >= 0; i--) {
                        if (closePrices[i] !== null) {
                            lastPrice = closePrices[i];
                            break;
                        }
                    }
                    
                    const change = lastPrice - meta.previousClose;
                    const changePercent = (change / meta.previousClose) * 100;
                    
                    priceDiv.innerHTML = `
                        <div class="price-display">₹${lastPrice.toFixed(2)}</div>
                        <div class="change ${change >= 0 ? 'positive' : 'negative'}">
                            ${change >= 0 ? '▲' : '▼'} ${Math.abs(change).toFixed(2)} (${changePercent.toFixed(2)}%)
                        </div>
                    `;
                    
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                } else {
                    resultDiv.textContent = '❌ No data received\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.textContent = '❌ Error: ' + error.message;
                console.error('Error:', error);
            }
        }

        // Auto-test on load
        window.onload = () => {
            testNiftyPrice();
        };
    </script>
</body>
</html>
